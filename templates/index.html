<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genetic Algorithm Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Genetic Algorithm Demo</h1>
        <p class="subtitle">Evolve a binary chromosome to match a target string.</p>

        <div class="card">
            <form id="gaForm">
                <div class="grid">
                    <div>
                        <label for="target">Target Bitstring</label>
                        <input type="text" id="target" value="11110000" placeholder="e.g. 11110000" />
                    </div>

                    <div>
                        <label for="population_size">Population Size</label>
                        <input type="number" id="population_size" value="30" min="2" />
                    </div>

                    <div>
                        <label for="generations">Generations</label>
                        <input type="number" id="generations" value="100" min="1" />
                    </div>

                    <div>
                        <label for="crossover_rate">Crossover Rate</label>
                        <input type="number" id="crossover_rate" value="0.8" step="0.01" min="0" max="1" />
                    </div>

                    <div>
                        <label for="mutation_rate">Mutation Rate</label>
                        <input type="number" id="mutation_rate" value="0.01" step="0.01" min="0" max="1" />
                    </div>
                </div>

                <button type="submit">Run Genetic Algorithm</button>
            </form>
        </div>

        <div class="card results">
            <h2>Result</h2>
            <div id="output">No run yet.</div>
        </div>

        <div class="card">
            <h2>Fitness Over Generations</h2>
            <canvas id="fitnessChart"></canvas>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
